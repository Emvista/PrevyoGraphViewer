<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Prevyo Graph Viewer</title>
  <meta name="description" content="Viewer de graphes JSON (nodes/edges) rendu interactif avec vis-network. Collez votre JSON et visualisez le graphe." />
  <meta property="og:title" content="Prevyo Graph Viewer" />
  <meta property="og:description" content="Collez un JSON nodes/edges et visualisez le graphe." />
  <meta property="og:type" content="website" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; img-src 'self' data:; style-src 'self'; script-src 'self' https://unpkg.com; upgrade-insecure-requests" />

  <link rel="stylesheet" href="./styles.css" />
  <script defer src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js" crossorigin="anonymous"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <header>
    <strong>Prevyo Graph Viewer</strong>
    <button type="button" id="btnRender">Afficher le graphe</button>
    <span class="hint">Collez un objet JSON avec <code>nodes</code> et <code>edges</code>, puis cliquez sur Afficher.</span>
    <span id="error" class="error" role="status" aria-live="polite"></span>
  </header>
  <label class="sr-only" for="editor">JSON du graphe</label>
  <textarea id="editor" spellcheck="false" placeholder='{ "nodes": [...], "edges": [...] }'></textarea>
  <div id="container"></div>
</body>
</html>
