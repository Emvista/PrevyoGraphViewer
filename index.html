<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Prevyo Graph Viewer</title>
  <meta name="description" content="Visualisez le graphe issu de la sortie Prevyo (JSON nodes/edges). Rendu interactif avec vis-network." />
  <meta name="application-version" content="0.2.0" />
  <meta property="og:title" content="Prevyo Graph Viewer" />
  <meta property="og:description" content="Collez le JSON graphe exporté par Prevyo et explorez les nœuds et les liens." />
  <meta property="og:type" content="website" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; form-action 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' https://unpkg.com; connect-src 'self' https://unpkg.com; upgrade-insecure-requests" />

  <link rel="stylesheet" href="./styles.css" />
  <script defer src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js" crossorigin="anonymous"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <header>
    <strong>Prevyo Graph Viewer</strong>
    <button type="button" id="btnRender">Afficher le graphe</button>
    <button type="button" id="btnTheme" aria-label="Passer en mode sombre">
      <svg class="theme-icon theme-icon-moon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
      <svg class="theme-icon theme-icon-sun" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <circle cx="12" cy="12" r="5"/>
        <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
        <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
      </svg>
    </button>
    <span class="edge-filters" aria-label="Filtres de relations">
      Masquer les relations :
      <label><input type="checkbox" id="filterContextSmall" checked /> ContextSmall</label>
      <label><input type="checkbox" id="filterContextLarge" checked /> ContextLarge</label>
    </span>
    <span class="hint">Collez ici le JSON graphe fourni par Prevyo (listes <code>nodes</code> et <code>edges</code>), puis cliquez sur Afficher le graphe.</span>
    <span id="error" class="error" role="status" aria-live="polite"></span>
  </header>
  <div class="main">
    <div class="sidebar">
      <label class="sr-only" for="editor">JSON du graphe</label>
      <textarea id="editor" spellcheck="false" placeholder='{ "nodes": [...], "edges": [...] }'></textarea>
    </div>
    <div
      class="splitter"
      role="separator"
      aria-orientation="vertical"
      aria-label="Redimensionner l'éditeur"
      tabindex="0"
    ></div>
    <div id="container" aria-label="Graphe"></div>
  </div>
  <footer class="footer">
    <span class="footer-credits">
      Édité par
      <a href="https://emvista.com" rel="noopener noreferrer" target="_blank">Emvista</a>
      <span class="footer-sep" aria-hidden="true">·</span>
      <a
        class="footer-prevyo-events"
        href="https://emvista.com/fr-prevyo-events/"
        rel="noopener noreferrer"
        target="_blank"
        title="Prevyo Events — solution de veille stratégique (Emvista)"
      >Prevyo Events</a>
      <span class="footer-sep" aria-hidden="true">·</span>
      <a
        class="footer-github"
        href="https://github.com/Emvista/PrevyoGraphViewer"
        rel="noopener noreferrer"
        target="_blank"
        aria-label="Code source sur GitHub (Emvista/PrevyoGraphViewer)"
        title="Dépôt GitHub PrevyoGraphViewer"
      >
        <svg class="footer-github-icon" width="20" height="20" viewBox="0 0 98 96" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
          <path fill="currentColor" fill-rule="evenodd" clip-rule="evenodd" d="M48.854 0C21.839 0 0 22 0 49.217c0 21.756 13.993 40.172 33.405 46.69 2.427.49 3.316-1.059 3.316-2.362 0-1.141-.08-5.052-.08-9.127-13.59 2.934-16.42-5.867-16.42-5.867-2.184-5.704-5.42-7.17-5.42-7.17-4.448-3.015.324-3.015.324-3.015 4.934.326 7.523 5.052 7.523 5.052 4.367 7.496 11.404 5.378 14.235 4.074.404-3.178 1.699-5.378 3.074-6.6-10.839-1.141-22.243-5.378-22.243-24.283 0-5.378 1.94-9.778 5.014-13.2-.485-1.222-2.184-6.275.486-13.038 0 0 4.125-1.304 13.426 5.052a46.97 46.97 0 0 1 12.214-1.63c4.125 0 8.33.571 12.213 1.63 9.302-6.356 13.427-5.052 13.427-5.052 2.67 6.763.97 11.816.485 13.038 3.155 3.422 5.015 7.822 5.015 13.2 0 18.905-11.404 23.06-22.324 24.283 1.814 1.63 3.42 4.79 3.42 9.726 0 7.037-.08 12.805-.08 14.494 0 1.304.89 2.853 3.316 2.364 19.412-6.52 33.405-24.935 33.405-46.691C97.707 22 75.788 0 48.854 0z"/>
        </svg>
      </a>
    </span>
    <span class="footer-version" data-version-footer title="Version de l’application">version x</span>
  </footer>
</body>
</html>
